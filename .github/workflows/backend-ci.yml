name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eza-v5/backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eza_ci
          POSTGRES_DB: eza_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eza_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI-safe test suite
        env:
          EZA_ENV: "ci"
          # eza-v5 must be importable as the `backend` package root
          PYTHONPATH: ${{ github.workspace }}/eza-v5
          # Disposable GitHub service DB for migration reproducibility (not production).
          EZA_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://eza_ci@localhost:5432/eza_ci
        run: |
          python -m pytest tests_core \
            tests_security/test_jwt_production_fail_closed.py \
            tests_security/test_phase81_production_surface_closure.py \
            tests_security/test_phase811_security_closure.py \
            tests_security/test_phase812_internal_api_authorization.py \
            tests_security/test_phase813_security_polish.py \
            tests/test_sensitive_content.py \
            tests/test_conversation_groups.py \
            tests/test_mirror_network.py \
            tests/test_mirror_network_publish.py \
            tests/test_mirror_journey_identity_phase1.py \
            tests/test_mirror_journey_identity_pass_closure.py \
            tests/test_mirror_journey_publish_contract.py \
            tests/test_mirror_journey_production_closure.py \
            tests/test_mirror_journey_scoped_d2.py \
            tests/test_mirror_journey_scoped_d2_live_prepare.py \
            tests/test_mirror_journey_phase35_readiness.py \
            tests/test_mirror_journey_phase36_publish_boundary.py \
            tests/test_mirror_journey_phase36b_payload_binding.py \
            tests/test_mirror_journey_phase37_core_contract.py \
            tests/test_mirror_journey_phase4_frozen_artifact.py \
            tests/test_mirror_journey_phase42_frozen_step_eza.py \
            tests/test_mirror_journey_phase431_frozen_eza_immutability.py \
            tests/test_mirror_journey_phase511_children_eligibility.py \
            tests/test_mirror_journey_phase52_child_lineage.py \
