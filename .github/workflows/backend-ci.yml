name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-ci:
    # Pin image to avoid ubuntu-latest migrations changing CI behavior mid-stream.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: eza-v5/backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eza_ci
          POSTGRES_DB: eza_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eza_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          # Keep pip on a known-good major; unpinned --upgrade pip can break
          # resolution when a new pip major lands between otherwise-identical pushes.
          python -m pip install --upgrade "pip<26"
          pip install -r requirements.txt

      - name: Run CI-safe test suite
        env:
          EZA_ENV: "ci"
          # eza-v5 must be importable as the `backend` package root
          PYTHONPATH: ${{ github.workspace }}/eza-v5
          # Disposable GitHub service DB for migration reproducibility (not production).
          EZA_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://eza_ci@localhost:5432/eza_ci
        run: |
          set -euo pipefail
          python -c "import backend,sys; print('backend=', backend.__file__); print('python=', sys.version)"
          python scripts/run_ci_safe_tests.py
