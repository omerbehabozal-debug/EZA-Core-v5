name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eza-v5/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: eza-v5/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Run validation tests
        run: npm run test:validation

      - name: Run Phase 8.1 security surface tests
        run: npx vitest run tests/productionSurfaceGuardPhase81.test.ts tests/productionSurfaceGuardPhase811.test.ts tests/productionSurfaceGuardPhase812.test.ts tests/productionSurfaceGuardPhase813.test.ts tests/phase82ShareDiscoverLoop.test.ts tests/discoverCard.test.tsx tests/phase83GuestAuthContinuity.test.ts tests/mergeGuestConversationTree.test.ts tests/phase831AuthPersistenceIsolation.test.ts tests/phase84PublicationVisibilityTrust.test.ts tests/phase841TrustEnforcement.test.ts tests/phase85PublicProfileIdentityPrivacy.test.ts tests/phase85bProfileExperienceDesign.test.tsx tests/phase85b1ProfilePolish.test.tsx tests/phase86JourneyV1ProductionClosure.test.ts tests/phase87MobileReturningUserFrictionlessAuth.test.ts tests/phase871SocialAuth.test.ts tests/phase872SocialAuthSecurity.test.ts tests/phase88PrivacySafeObservability.test.ts tests/phase881OpsTelemetryAbuseClosure.test.ts tests/phase88fYansiDesktopStages15.test.ts tests/phase88fProfileSidePanel.test.tsx tests/phase88fYansiExperienceModeControls.test.tsx tests/phase88f2SidebarYansiStatus.test.tsx tests/yansiCreatorIdentity.test.tsx tests/publicHonorificSurfaces.test.tsx tests/planStoreSession.test.ts tests/authTokenStore.test.ts

      - name: Run mirror and observation regression tests
        run: >-
          npx vitest run
          tests/mirrorNetworkPublish.test.ts
          tests/ezaExperienceAdapter.test.ts
          tests/conversationGroups.test.tsx
          tests/shareLinkPrepareIntent.test.ts
          tests/discoverCopy.test.ts
          tests/discoverCard.test.tsx
          tests/discoverExperiencedMirrors.test.ts
          tests/discoverModesPhase71.test.ts
          tests/sainaDiscoverModesPhase71.test.tsx
          tests/sainaDiscoverStrongCuriosityPhase75.test.tsx
          tests/discoverFeedPhase751.test.ts
          tests/sainaDiscoverDeliveryPhase751.test.tsx
          tests/yansiExposurePrefetchPhase751.test.tsx
          tests/mirrorPanelCopy.test.ts
          tests/conversationMeaningSummary.test.ts
          tests/mirrorDirectorPrA.test.ts
          tests/mirrorExperienceWiring.test.ts
          tests/mirrorDraftContract.test.ts
          tests/mirrorDirectorPreparePrC.test.ts
          tests/mirrorConversationContextD1.test.ts
          tests/mirrorInterpretationD2.test.ts
          tests/mirrorBenchmarkMode.test.ts
          tests/shouldAutoGenerateMirrorScene.test.ts
          tests/explicitSceneGenerationGuard.test.ts
          tests/dailyMirrorCreatePreflight.test.ts
          tests/d2FailClosedSceneGeneration.test.ts
          tests/mirrorJourneyReview8.test.ts
          tests/mirrorJourneyWindows.test.ts
          tests/mirrorJourneyScopedD2.test.ts
          tests/mirrorJourneyScopedD2LivePrepare.test.ts
          tests/mirrorJourneyPhase35Reuse.test.ts
          tests/mirrorJourneyPhase36PublishBoundary.test.ts
          tests/mirrorJourneyPhase37CoreContract.test.ts
          tests/mirrorJourneyPhase375PanelReadiness.test.ts
          tests/mirrorJourneyPhase38AynaReel.test.tsx
          tests/mirrorJourneyPhase381ShareClosure.test.ts
          tests/mirrorJourneyPhase42FrozenStepEza.test.ts
          tests/mirrorJourneyPhase43EzaUserControls.test.tsx
          tests/mirrorJourneyPhase431Closure.test.tsx
          tests/mirrorJourneyPhase50ProgressiveReplay.test.tsx
          tests/mirrorJourneyPhase51ContinuousChildScroll.test.tsx
          tests/mirrorJourneyPhase511NoAutoScroll.test.tsx
          tests/mirrorJourneyPhase512ReplaySkipResume.test.tsx
          tests/mirrorJourneyPhase52ChildCreation.test.ts
          tests/mirrorJourneyPhase60ExperienceIngest.test.tsx
          tests/yansiPublicMetricsPhase61.test.ts
          tests/yansiPublicMetricsCopyPhase62.test.ts
          tests/mirrorJourneyPhase62PublicMetricsUi.test.tsx
          tests/yansiPublicMetricsPhase621.test.tsx
          tests/yansiExperienceSessionPhase622.test.ts
          tests/yansiExposurePhase64.test.ts

      - name: Run Visual Identity regression tests
        run: >-
          npx vitest run
          tests/conversationSceneIdentity.test.ts
          tests/mirrorGuestConversation.test.ts
          tests/standaloneSainaShell.test.tsx
          tests/phase88fProfileSidePanel.test.tsx
          tests/yansiCreatorIdentity.test.tsx
          tests/publicHonorificSurfaces.test.tsx
          tests/conversationMirrorV2.test.ts
          tests/conversationMirrorV3.test.ts
          tests/conversationMirrorV5.test.ts
          tests/textFreeMirrorD0.test.ts
