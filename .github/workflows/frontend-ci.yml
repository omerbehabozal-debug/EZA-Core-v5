name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eza-v5/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: eza-v5/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Run validation tests
        run: npm run test:validation

      - name: Run mirror and observation regression tests
        run: >-
          npx vitest run
          tests/mirrorNetworkPublish.test.ts
          tests/ezaExperienceAdapter.test.ts
          tests/conversationGroups.test.tsx
          tests/shareLinkPrepareIntent.test.ts
          tests/discoverCopy.test.ts
          tests/discoverCard.test.tsx
          tests/discoverExperiencedMirrors.test.ts
          tests/mirrorPanelCopy.test.ts
          tests/conversationMeaningSummary.test.ts
          tests/mirrorDirectorPrA.test.ts
          tests/mirrorExperienceWiring.test.ts
          tests/mirrorDraftContract.test.ts
          tests/mirrorDirectorPreparePrC.test.ts
          tests/mirrorConversationContextD1.test.ts
          tests/mirrorInterpretationD2.test.ts
          tests/mirrorBenchmarkMode.test.ts
          tests/shouldAutoGenerateMirrorScene.test.ts
          tests/explicitSceneGenerationGuard.test.ts
          tests/dailyMirrorCreatePreflight.test.ts
          tests/d2FailClosedSceneGeneration.test.ts
          tests/mirrorJourneyReview8.test.ts
          tests/mirrorJourneyWindows.test.ts
          tests/mirrorJourneyScopedD2.test.ts
          tests/mirrorJourneyScopedD2LivePrepare.test.ts
          tests/mirrorJourneyPhase35Reuse.test.ts
          tests/mirrorJourneyPhase36PublishBoundary.test.ts
          tests/mirrorJourneyPhase37CoreContract.test.ts
          tests/mirrorJourneyPhase375PanelReadiness.test.ts
          tests/mirrorJourneyPhase38AynaReel.test.tsx
          tests/mirrorJourneyPhase381ShareClosure.test.ts
          tests/mirrorJourneyPhase42FrozenStepEza.test.ts
          tests/mirrorJourneyPhase43EzaUserControls.test.tsx
          tests/mirrorJourneyPhase431Closure.test.tsx

      - name: Run Visual Identity regression tests
        run: >-
          npx vitest run
          tests/conversationSceneIdentity.test.ts
          tests/mirrorGuestConversation.test.ts
          tests/standaloneSainaShell.test.tsx
          tests/conversationMirrorV2.test.ts
          tests/conversationMirrorV3.test.ts
          tests/conversationMirrorV5.test.ts
          tests/textFreeMirrorD0.test.ts
